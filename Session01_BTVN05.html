<!DOCTYPE html>
<html lang="en">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <body>
        <script>
            let name=prompt("Nhập tên sách:");
            let year=Number(prompt("Nhập năm xuất bản của sách:"));
            const now=new Date().getFullYear();
            let age=now-year;
            console.log("Sách: "+name);
            console.log("Năm xuất bản: "+year);
            console.log("Tuổi của sách: "+age+" năm");
        </script>
    </body>
</html>
